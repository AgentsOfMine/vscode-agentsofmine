name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Compile
        run: pnpm compile

      - name: Test
        run: xvfb-run -a pnpm test
        # xvfb-run required: @vscode/test-electron needs a display on Linux CI

      - name: Package
        run: pnpm package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: vscode-agentsofmine-vsix
          path: '*.vsix'
          if-no-files-found: error
